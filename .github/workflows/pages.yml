name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permite que el job posterior haga deploys a Pages
permissions:
  contents: read
  pages: write
  id-token: write

# No ejecutar el deploy si hay un deploy anterior en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Aplanamos web/ en la raíz del artifact, para que Pages sirva la
      # webapp en la URL canónica (https://<user>.github.io/<repo>/)
      # y no en /web/.
      - name: Flatten web/ into artifact root
        run: |
          mkdir _site
          # Copia primero los ocultos (p.ej. .nojekyll si lo hubiera) y luego el resto
          shopt -s dotglob
          cp -r web/* _site/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
